<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App Personal</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MiApp">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="selector-usuario" id="selector-usuario">
    <div class="modal">
      <h3 id="titulo-auth">Inicia sesión</h3>
      <input type="email" id="input-email" placeholder="Correo electrónico">
      <input type="password" id="input-password" placeholder="Contraseña">
      <input type="text" id="input-nombre-registro" placeholder="Nombre para mostrar" style="display:none; margin-top:10px;">
      <div class="modal-botones">
        <button id="btn-guardar-nombre" class="btn-primario">Iniciar sesión</button>
      </div>
      <button id="btn-google" class="btn-secundario btn-google">Continuar con Google</button>
      <p class="texto-auth">
        <span id="texto-cambiar-modo">¿No tienes cuenta? Regístrate</span>
      </p>
    </div>
  </div>

  <div class="app">
<div class="saludo-usuario">
  Hola, <strong id="nombre-usuario-actual">...</strong>
  <button id="btn-cerrar-sesion" title="Cerrar sesión">↪</button>
</div>

    <div class="mascota-card">
      <img src="icon-192.png" alt="Mi mascota">
      <div class="racha">
        Racha: <strong id="racha-dias">0 días</strong>
        <span class="separador-racha">•</span>
        Puntos: <strong id="puntos-equipo">0</strong>
      </div>
    </div>

    <div class="bandeja">
      <h2>Bandeja de entrada</h2>
      <div class="nueva-tarea">
        <input type="text" id="input-tarea" placeholder="¿Qué tienes pendiente?">
        <button id="btn-agregar">+</button>
      </div>
      <button id="btn-abrir-dibujo" class="btn-dibujo">✏️ Dibujar</button>
      <div class="seccion-contactos">
        <h3>Contactos</h3>
        <div class="nueva-tarea nueva-tarea-contactos">
          <input type="email" id="input-contacto-email" placeholder="Correo del contacto">
          <button id="btn-agregar-contacto">+</button>
        </div>
        <div class="lista-contactos" id="lista-contactos"></div>
      </div>
      <div class="seccion-vinculos">
        <h3>Vincular con mi pareja</h3>
        <button id="btn-vincular-pareja" class="btn-dibujo">Generar código</button>
        <div class="nueva-tarea nueva-tarea-contactos">
          <input type="text" id="input-codigo-vinculo" placeholder="Código de pareja">
          <button id="btn-aceptar-vinculo">✓</button>
        </div>
        <div class="estado-vinculo" id="estado-vinculo">Sin vínculo activo</div>
      </div>
      <ul class="lista-tareas" id="lista-tareas">
        <li class="tarea-vacia">No tienes pendientes por clasificar</li>
      </ul>

      <div class="seccion-dibujos">
        <h3>Dibujos para ti</h3>
        <div class="lista-dibujos" id="lista-dibujos"></div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-titulo">¿Cuándo quieres hacerlo?</h3>
      <div id="campo-fecha">
        <label>Día</label>
        <input type="date" id="modal-fecha">
      </div>
      <label>Hora</label>
      <input type="time" id="modal-hora">
      <div class="modal-botones">
        <button id="modal-cancelar" class="btn-secundario">Cancelar</button>
        <button id="modal-guardar" class="btn-primario">Guardar</button>
      </div>
    </div>
  </div>

  <div class="dibujo-overlay" id="dibujo-overlay">
    <div class="dibujo-panel">
      <div class="dibujo-controles">
        <button id="dibujo-cancelar" class="btn-secundario">Cancelar</button>
        <div class="dibujo-opciones">
          <input type="color" id="color-dibujo" value="#2E6FBF">
          <input type="range" id="grosor-dibujo" min="1" max="16" value="4">
          <select id="select-destinatario-dibujo" class="select-destinatario"></select>
        </div>
        <button id="dibujo-enviar" class="btn-primario">Enviar</button>
      </div>
      <canvas id="canvas-dibujo"></canvas>
    </div>
  </div>

  <div class="dibujo-preview-overlay" id="dibujo-preview-overlay">
    <div class="dibujo-preview-contenido">
      <button id="dibujo-preview-cerrar" class="btn-secundario">Cerrar</button>
      <img id="dibujo-preview-img" alt="Dibujo compartido">
      <p id="dibujo-preview-autor"></p>
    </div>
  </div>

  <div class="celebracion-overlay" id="celebracion-overlay">
    <div class="confeti-contenedor" id="confeti-contenedor"></div>
    <div class="celebracion-contenido">
      <img src="icon-192.png" alt="Mascota feliz" class="celebracion-mascota" id="celebracion-mascota">
      <h2 id="celebracion-titulo">¡Lo lograste!</h2>
      <p id="celebracion-mensaje">Completaste tu primera tarea 🎉</p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
